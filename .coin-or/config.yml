Description:
  Slug: Bonmin
  ShortName: Bonmin
  LongName: Basic Open-source Nonlinear Mixed INteger programming
  ShortDescription: An open-source solver for mixed integer nonlinear optimization problems (MINLPs).
  LongDescription: |2
    Bonmin (Basic Open-source Nonlinear Mixed INteger programming) is
    an open-source code for solving general MINLP (Mixed Integer NonLinear
    Programming) problems. It builds on top of Cbc and Ipopt and features
    several algorithms, including NLP-based branch-and-bound, outer
    approximation decomposition, Quesada and Grossmann's branch-and-cut,
    and a hybrid outer-approximation based branch-and-cut. The algorithms
    are exact when the problem is convex and act as heuristics otherwise.
  Manager: Pierre Bonami
  Homepage: https://github.com/coin-or/Bonmin
  License: Eclipse Public License 1.0
  LicenseURL: http://www.opensource.org/licenses/EPL-1.0
  Zenodo: 28551157
  IncludedIn:
    Package: Bonmin
  Language:
    - C++
  Categories:
    - Optimization deterministic nonlinear discrete
  PaperCite: https://doi.org/10.1016/j.disopt.2006.10.011

